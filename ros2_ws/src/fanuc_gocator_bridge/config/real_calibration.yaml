/**:
  ros__parameters:
    use_sim_time: false
    runtime:
      backend: real
    evaluation:
      truth_available: false
    # The copied precision-ball result is only a mounting nominal. It is not
    # reported as ground truth and may later be deliberately degraded.
    initial_handeye:
      rotation: [0.0604898732, 0.8875159337, -0.4567892759,
                 -0.9852687180, -0.0202462665, -0.1698106065,
                 -0.1599578964, 0.4603320063, 0.8732169921]
      translation_m: [-0.011579, -0.004621, 0.359284]
    handeye_init_rotation_error_deg: 0.0
    handeye_init_translation_error_mm: 0.0
    measurement:
      pose_source: topic
    interfaces:
      joint_state_topic: /joint_states
      profile_topic: /gocator/profile
      target_surface_topic: /calibration/target_surface_points
      endpoint_topic: /calibration/endpoints
      detection_prior_topic: /calibration/detection_prior
      measured_detection_prior_topic: /calibration/detection_measured_prior
      detection_control_topic: /calibration/detection_control
      flange_pose_topic: /calibration/flange_pose
      base_frame: base_link
      flange_frame: fanuc_flange
      sensor_frame: gocator_sensor
      joint_names: [J1_joint, J2_joint, J3_joint, J4_joint, J5_joint, J6_joint]
    # Gocator 2450 native engineering coordinates have negative Z in front of
    # this sensor. The normalized calibration frame is the same right-handed
    # frame used by the nominal hand-eye result: (x, y, z) -> (x, -y, -z).
    sensor:
      hard_trapezoid: [0.05, 0.52, -0.31, -0.31, 0.13, 0.13]
      safe_trapezoid: [0.07, 0.48, -0.28, -0.28, 0.11, 0.11]
      min_range_m: 0.05
      max_range_m: 0.52
    seed:
      # Real PC_TRACK_ALL executes a low-speed Cartesian L move.  The Gazebo
      # four-second action timeout is therefore invalid for hardware.
      motion_timeout_s: 100.0
      motion_duration_s: 5.0
      # Start real target exploration with 1 degree increments.  A 2.5 degree
      # first step moved the selected chord outside the local tracking basin
      # before measured feedback could intervene.
      rotation_step_deg: 1.0
      # Keep the chord centred before rotating again.  A 1 deg Y-axis step
      # moves the laser line across the plate by ~5-17 mm (lever arm x step);
      # with the old 25 mm default the line left the 48 mm wide plate and the
      # bilateral feature was lost.  8 mm leaves enough margin for the next
      # step to stay on the plate.
      rotation_continue_max_abs_x_mid_m: 0.008
      # Measurement retry starts after the post-motion settling interval.
      # Keep three full seconds for measurement_sync and the detector's
      # consecutive-frame reacquisition on real hardware.
      measurement_retry_timeout_s: 3.0
      preflight:
        # The failed trial had x_mid=14.5 mm and narrowly skipped the common
        # 15 mm auto-preflight threshold.  Require measured +/-X/+/-Y probing
        # for such off-centre real starts so an unsafe sign can be reordered.
        auto_skip_maximum_abs_x_mid_m: 0.010
      initial:
        maximum_abs_x_mid_m: 0.03
        minimum_z_mid_m: 0.08
        maximum_z_mid_m: 0.45
    settling_time_s: 0.8
    maximum_measurement_skew_s: 0.20

    # Real workbench profiles can contain a thin height step or visible plate
    # side walls. Use the same detector as simulation, with target dimensions
    # and a broad central ROI as selection constraints.
    endpoint_detection:
      # CSRT was selected from the recorded real-profile comparison. ALIGN is
      # still bounded by the purple guide; after lock, the image trackers only
      # provide local association and all published points remain measured.
      backend: roi
      # Matches the validated offline command `--stride 4` and prevents the
      # high-rate periodic bad profiles from continually resetting ALIGN.
      roi_process_every_n_frames: 4
      measured_prior_topic: /calibration/detection_measured_prior
      # A tracked physical breakpoint pair remains useful even when only a
      # short top-surface chord is visible.  Ten millimetres is the safety
      # floor; the normal operating chord is still expected to be much longer.
      minimum_segment_length_m: 0.01
      # Absolute breakpoint-span limit.  0.25 m rejected the 20x20 cm plate
      # diagonal (0.2828 m) before the laser line could reach it; 0.35 m
      # covers the physical maximum with margin.
      maximum_segment_length_m: 0.35
      # Chord ratio limits are relative to the ALIGN-locked reference length.
      # 6.0 covers the 20x20 cm plate diagonal (5.5x a ~52 mm lock chord) so
      # a lengthening laser line is not rejected before the physical maximum.
      roi_tracking_minimum_chord_ratio: 0.20
      roi_tracking_maximum_chord_ratio: 6.00
      # Per-processed-frame ROI/breakpoint movement limits.  With
      # roi_process_every_n_frames=4 a 15 mm limit meant only 3.75 mm per raw
      # frame; 30 mm still rejects real jumps while tolerating slow lengthen.
      roi_jump_m: 0.030
      bp_jump_m: 0.030
      maximum_residual_rms_m: 0.0005
      smoothing_window: 5
      local_fit_window: 12
      angle_change_threshold_deg: 10.0
      height_jump_threshold_m: 0.00020
      breakpoint_cluster_points: 8
      maximum_abs_surface_midpoint_x_m: 0.08
      # Desired first observation in the real Gocator X-Z frame. The operator
      # aligns the physical top-surface chord to this visible finite guide.
      alignment_template_center_x_m: 0.0
      alignment_template_center_z_m: 0.28
      alignment_template_length_m: 0.08
      alignment_template_angle_deg: 25.0
      alignment_normal_gate_m: 0.003
      alignment_endpoint_gate_m: 0.020
      tracking_normal_gate_m: 0.006
      tracking_endpoint_gate_m: 0.025
      predicted_normal_gate_m: 0.012
      predicted_endpoint_gate_m: 0.050
      # Classic-backend fallback: after short Kalman coasting fails, permit a
      # wider local recovery but
      # never commit a workbench/side segment whose shape jumps abruptly.
      reacquire_maximum_segment_length_change_m: 0.050
      reacquire_maximum_segment_angle_change_deg: 20.0
      reacquire_stability_m: 0.003
      # True temporal tracking is used only while collecting automatic seeds.
      # 1.5 mm is the minimum local breakpoint window; covariance can expand
      # it up to the 25 mm tracking endpoint gate after short dropouts.
      temporal_tracking_enabled: true
      temporal_initial_position_std_m: 0.0005
      temporal_initial_velocity_std_m_s: 0.05
      temporal_process_acceleration_std_m_s2: 1.0
      temporal_measurement_std_floor_m: 0.00008
      temporal_partial_measurement_std_m: 0.0005
      temporal_mahalanobis_threshold: 13.82
      # T1 seed motion is slow.  Independent e1/e2 updates prevent one hidden
      # edge from discarding the other; twenty frames bound the remaining
      # one-sided coast before a measured local recovery is required.
      temporal_maximum_endpoint_speed_m_s: 0.05
      temporal_maximum_coast_frames: 20
      temporal_minimum_search_radius_m: 0.0015
      temporal_search_sigma_multiplier: 3.0
      temporal_maximum_local_candidates: 6
      # The visible chord length is view dependent and can legitimately grow
      # by more than 60% during a local wrist rotation.  Identity protection
      # therefore comes from persistent edge shape plus the 3 mm per-frame
      # endpoint continuity bound, not from freezing the initial chord length.
      # Ratios below are emergency-only bounds; the absolute detector floor is
      # still 10 mm as requested for short valid chords.
      tracking_maximum_endpoint_step_m: 0.003
      tracking_minimum_reference_length_ratio: 0.10
      tracking_maximum_reference_length_ratio: 4.00

    # Independent real-hardware accuracy evaluation. The spheres are never
    # used to update the calibrated hand-eye transform. Their engraved
    # diameters are provisional references until traceable certificates are
    # recovered; roundness is a form specification, not diameter uncertainty.
    sphere_validation:
      profile_topic: /gocator/profile
      flange_pose_topic: /calibration/flange_pose
      artifacts:
        sphere_30mm:
          model: D30GZ
          engraved_diameter_mm: 30.0060
          engraved_roundness_mm: 0.0008
        sphere_20mm:
          model: D20GZ
          engraved_diameter_mm: 20.0020
          engraved_roundness_mm: 0.0007
      # Ten views exceed the seven-view minimum and permit leave-one-view-out
      # diagnosis. Twelve stationary frames suppress random profile noise
      # without turning one repeated view into twelve independent poses.
      target_poses: 10
      frames_per_pose: 12
      initial_data_timeout_s: 8.0
      capture_timeout_s: 12.0
      minimum_pose_rotation_separation_deg: 5.0
      minimum_pose_translation_separation_mm: 15.0
      segmentation:
        # Selection is performed only in the sensor X-Z profile. No base-frame
        # residual and no hand-eye value can make a segment look more valid.
        minimum_points: 16
        minimum_chord_m: 0.004
        maximum_arc_length_m: 0.12
        absolute_neighbor_gap_m: 0.0015
        neighbor_gap_multiplier: 6.0
        minimum_slice_radius_fraction: 0.25
        maximum_slice_radius_overrun_m: 0.0015
        maximum_circle_rms_m: 0.00030
        circle_robust_scale_m: 0.00010
      fit_robust_scale_m: 0.00010
      bootstrap_trials: 100
      random_seed: 20260813
      thresholds:
        minimum_poses: 7
        maximum_fixed_radius_rmse_m: 0.00010
        maximum_fixed_radius_p95_m: 0.00020
        maximum_free_diameter_error_m: 0.00010

fanuc_joint_state:
  ros__parameters:
    poll_rate_hz: 10.0
    publish_rate_hz: 20.0
    # Validated at four UF1/UT1 stationary poses on 2026-08-13. All four
    # selected +1; correct-model disagreement was below 0.0002 mm / 0.00004
    # deg while alternatives differed by 63--609 mm.
    j23_validated: true
    j23_factor: 1.0
    validation_utool: 1
    validation_uframe: 1
    validation_controller_origin_in_base_mm: [0.0, 0.0, 425.0]
    raw_topic: /fanuc/joint_states_raw
    normalized_topic: /joint_states

# The TP program must be PC_TRACK_ALL with UFRAME_NUM=1 and UTOOL_NUM=1.
# Mode and write permission are intentionally absent here.  The node's own
# defaults remain plan_only/false, while the launch wrapper supplies explicit
# values.  A node-specific YAML value would override launch's wildcard file.
fanuc_motion_bridge:
  ros__parameters:
    joint_state_topic: /joint_states
    action_name: /joint_trajectory_controller/follow_joint_trajectory
    joint_names: [J1_joint, J2_joint, J3_joint, J4_joint, J5_joint, J6_joint]
    utool: 1
    uframe: 1
    # FANUC R-30iB PR-object wire convention: write 0/0; reads normalize it
    # to 255/255.  This is separate from TP's active UFRAME/UTOOL=1/1.
    pr_utool_wire_value: 0
    pr_uframe_wire_value: 0
    controller_origin_in_base_mm: [0.0, 0.0, 425.0]
    # First real trials deliberately use a low Cartesian speed.  PC_TRACK_ALL
    # applies this through R[120] to `L PR[10] ... FINE`.
    speed_mm_s: 5.0
    minimum_speed_mm_s: 1
    maximum_speed_mm_s: 20
    maximum_joint_step_deg: 6.0
    maximum_joint_distance_rad: 0.20
    maximum_translation_mm: 80.0
    maximum_rotation_deg: 10.0
    minimum_joint_margin_deg: 3.0
    cartesian_path_samples: 5
    maximum_joint_state_age_s: 0.5
    maximum_joint_speed_rad_s: 0.01
    arrival_tolerance_deg: 1.0
    approval_timeout_s: 120.0
    motion_timeout_s: 90.0
    validation_position_tolerance_mm: 2.0
    validation_rotation_tolerance_deg: 1.0

gocator_profile_driver:
  ros__parameters:
    initial_laser_state: false
    output_topic: /gocator/profile_raw_mm
    frame_id: gocator_sensor
    laser_service_name: /gocator/set_laser_state

gocator_metric_adapter:
  ros__parameters:
    input_topic: /gocator/profile_raw_mm
    output_topic: /gocator/profile
    output_frame: gocator_sensor
    coordinate_scale: 0.001
    coordinate_axis_sign: [1.0, -1.0, -1.0]

measurement_sync:
  ros__parameters:
    joint_state_topic: /joint_states
    profile_topic: /gocator/profile
    flange_pose_topic: /calibration/flange_pose
    maximum_stamp_skew_s: 0.20
    maximum_joint_speed_rad_s: 0.01
    minimum_stable_samples: 3
