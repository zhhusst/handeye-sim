[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ros2_ws/src/handeye_sim_bridge"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "ros2_ws/build",
  "ros2_ws/install",
  "ros2_ws/log",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
